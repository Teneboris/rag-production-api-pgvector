services:
  agent-api:
    build: .
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    healthcheck:
      test:
        - "CMD"
        - "/app/.venv/bin/python"
        - "c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs
    restart: unless-stopped
