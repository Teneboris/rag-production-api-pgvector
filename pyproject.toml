[project]
name = "rag-production"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.6",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.18",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "llama-index>=0.14.25",
    "llama-index-readers-file>=0.5.0",
    "llama-index-embeddings-ollama>=0.10.0",
    "llama-index-llms-ollama>=0.11.0",
    "llama-index-vector-stores-postgres>=0.9.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "unstructured>=0.27.16",
    "uvicorn>=0.52.4",
]

[project.scripts]
rag-production = "rag_production:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
